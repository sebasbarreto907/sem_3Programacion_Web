<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar un comentario</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="comment-card" aria-labelledby="page-title">
      <p class="eyebrow">Participa en la conversación</p>
      <h1 id="page-title">Deja tu comentario</h1>
      <p class="intro">Comparte una idea o cuéntanos qué te pareció.</p>

      <form id="comment-form">
        <label for="comment">Tu comentario</label>
        <textarea
          id="comment"
          name="comment"
          maxlength="280"
          placeholder="Escribe aquí..."
          aria-describedby="counter"
          required
        ></textarea>

        <div class="form-footer">
          <span id="counter" class="counter" aria-live="polite">0/280</span>
          <button id="publish-button" type="submit">Publicar</button>
        </div>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
