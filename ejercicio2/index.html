<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear una cuenta</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="account-card" aria-labelledby="page-title">
      <p class="eyebrow">Bienvenido</p>
      <h1 id="page-title">Crea tu cuenta</h1>
      <p class="intro">Elige una contraseña segura para comenzar.</p>

      <form id="signup-form" novalidate>
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Escribe tu contraseña"
            autocomplete="new-password"
            aria-describedby="password-requirements"
          >
          <button
            id="toggle-password"
            class="visibility-button"
            type="button"
            aria-pressed="false"
            aria-controls="password"
          >👁️ Mostrar</button>
        </div>

        <p class="requirements-title">Tu contraseña debe incluir:</p>
        <ul id="password-requirements" class="requirements">
          <li id="requirement-length">Al menos 8 caracteres</li>
          <li id="requirement-uppercase">Una letra mayúscula</li>
          <li id="requirement-number">Un número</li>
        </ul>

        <button class="submit-button" type="submit">Crear cuenta</button>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
