<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="task-card" aria-labelledby="page-title">
      <p class="eyebrow">Organiza tu día</p>
      <h1 id="page-title">Lista de tareas</h1>
      <p class="intro">Anota lo que tienes pendiente y avanza a tu ritmo.</p>

      <form id="task-form">
        <label for="task-input">Nueva tarea</label>
        <div class="task-entry">
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="Por ejemplo: estudiar para el examen"
            autocomplete="off"
            required
          >
          <button type="submit">Agregar</button>
        </div>
        <p class="hint">Presiona Escape para borrar el campo.</p>
      </form>

      <ul id="task-list" class="task-list" aria-label="Tareas"></ul>
      <p id="empty-state" class="empty-state">Aún no tienes tareas. ¡Agrega la primera!</p>
    </section>
  </main>
</body>
</html>
